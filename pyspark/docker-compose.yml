services:
  spark-master:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-master.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - .:/app
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker-1:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-3:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-4:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master
