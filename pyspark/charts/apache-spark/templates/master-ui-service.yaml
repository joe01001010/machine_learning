apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: apache-spark
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: master
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apache-spark
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: master
  ports:
    - name: web
      port: 8080
      targetPort: web
      nodePort: {{ .Values.master.ui.nodePort }}
